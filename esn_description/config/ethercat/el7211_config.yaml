# Configuration file for Beckhoff EL1008
vendor_id: 0x00000002            # Beckhoff
product_id: 0x1c2b3052           # from ProductCode=472592466
tpdo:  # TxPDO
  - index: 0x1a00
    channels:
      - {index: 0x6000, sub_index: 17, type: uint32, state_interface: position}
  - index: 0x1a01
    channels:
      - {index: 0x6010, sub_index: 1, type: uint16, state_interface: statusword}
  - index: 0x1a02
    channels:
      - {index: 0x6010, sub_index: 7, type: int32, state_interface: velocity}
  - index: 0x1a03
    channels:
      - {index: 0x6010, sub_index: 8, type: int16, state_interface: torque}
  # - index: 0x1a04
  #   channels:
  #     - {index: 0x6010, sub_index: 18, type: uint16, state_interface: info_data_1}
  # - index: 0x1a05
  #   channels:
  #     - {index: 0x6010, sub_index: 19, type: uint16, state_interface: info_data_2}
  # - index: 0x1a06
  #   channels:
  #     - {index: 0x6010, sub_index: 6, type: int32, state_interface: following_error}


rpdo:
  - index: 0x1600
    channels:
      - {index: 0x7010, sub_index: 1, type: uint16, command_interface: controlword}

  - index: 0x1601
    channels:
      - {index: 0x7010, sub_index: 6, type: int32, command_interface: target_velocity}

  - index: 0x1602
    channels:
      - {index: 0x7010, sub_index: 9, type: int16, command_interface: target_torque}

  # - index: 0x1603
  #   channels:
  #     - {index: 0x7010, sub_index: 14, type: uint16, command_interface: commutation_angle}

  # - index: 0x1604
  #   name: drv_torque_limitation
  #   channels:
  #     - {index: 0x7010, sub_index: 11, type: uint16, command_interface: torque_limit}

  # - index: 0x1605
  #   name: drv_torque_offset
  #   channels:
  #     - {index: 0x7010, sub_index: 10, type: int16, command_interface: torque_offset}

  - index: 0x1606
    channels:
      - {index: 0x7010, sub_index: 5, type: uint32, command_interface: target_position}


  - index: 0x1608
    channels:
      - {index: 0x7010, sub_index: 3, type: uint8, command_interface: modes_of_operation}

# Sync Manager
sm:
  - {index: 2, type: output, pdo: rpdo, watchdog: enable}   # RxPDO -> SM2 (Outputs)
  - {index: 3, type: input,  pdo: tpdo, watchdog: enable}   # TxPDO -> SM3 (Inputs)
